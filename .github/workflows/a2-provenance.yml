name: A.4 Human Auth Audit

on:
  push:
    branches:
      - audit/a4-human-auth
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a4-human-auth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  human-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Dashboard
        run: npm run build
      - name: Run tests
        run: npm test
